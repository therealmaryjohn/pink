<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Us | Pink World</title>
<link rel="icon" type="image/png" href="images/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
</head>
<body>

<div id="header-placeholder"></div>
<div class="page-banner"><h1>Contact Us</h1></div>

<div class="container">
  <div style="display:grid; grid-template-columns: 1fr 1fr; gap:40px; align-items:start;" id="contactGrid">
    <div class="cart-summary">
      <h3 style="color:var(--pink-dark); margin-bottom:16px;">Send Us a Message</h3>
      <form id="contactForm">
        <div class="form-group"><label>Your Name</label><input type="text" id="cName" required></div>
        <div class="form-group"><label>Phone Number</label><input type="text" id="cPhone" required></div>
        <div class="form-group"><label>Message</label><textarea id="cMessage" rows="5" required placeholder="How can we help you?"></textarea></div>
        <button type="submit" class="btn btn-primary btn-block">Send via WhatsApp</button>
      </form>
    </div>
    <div>
      <div class="cart-summary" style="margin-bottom:20px;">
        <h3 style="color:var(--pink-dark); margin-bottom:12px;">Get in Touch</h3>
        <p style="margin-bottom:10px;">📧 Email: <strong id="emailDisplay"></strong></p>
        <p style="margin-bottom:10px;">💬 WhatsApp us directly for the fastest response.</p>
        <a id="whatsappDirectLink" href="#" target="_blank" class="btn btn-whatsapp" style="margin-top:10px;">Chat on WhatsApp</a>
      </div>
      <div id="branchContactList"></div>
    </div>
  </div>
</div>

<div id="footer-placeholder"></div>

<script src="js/config.js"></script>
<script src="js/products.js"></script>
<script src="js/inventory.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/notify-config.js"></script>
<script src="js/auth.js"></script>
<script src="js/products-sync.js"></script>
<script src="js/wishlist.js"></script>
<script src="js/orders.js"></script>
<script src="js/email-notify.js"></script>
<script src="js/cart.js"></script>
<script src="js/main.js"></script>
<script>
  initLayout("contact");
  document.getElementById("emailDisplay").textContent = STORE_CONFIG.email;
  document.getElementById("whatsappDirectLink").href = `https://wa.me/${STORE_CONFIG.whatsapp}`;
  document.getElementById("branchContactList").innerHTML = STORE_CONFIG.branches.map(b => `
    <div class="cart-summary" style="margin-bottom:16px;">
      <h4 style="color:var(--pink-dark); margin-bottom:8px;">${b.name}</h4>
      <p style="font-size:14px; margin-bottom:4px;">${b.address}</p>
      <p style="font-size:14px;">📞 ${b.phone}</p>
    </div>
  `).join("");

  document.getElementById("contactForm").addEventListener("submit", async function (e) {
    e.preventDefault();
    const name = document.getElementById("cName").value;
    const phone = document.getElementById("cPhone").value;
    const msg = document.getElementById("cMessage").value;

    if (typeof sendContactNotificationEmail === "function") {
      try { await sendContactNotificationEmail({ name, phone, message: msg }); }
      catch (err) { console.warn("Contact email notification failed:", err); }
    }
    if (typeof saveInquiryIfConfigured === "function") {
      try { await saveInquiryIfConfigured({ name, phone, message: msg }); }
      catch (err) { console.warn("Could not save inquiry:", err); }
    }

    const text = `Hello ${STORE_CONFIG.name}, my name is ${name} (${phone}).\n\n${msg}`;
    window.open(`https://wa.me/${STORE_CONFIG.whatsapp}?text=${encodeURIComponent(text)}`, "_blank");
  });
</script>

<style>
  @media (max-width: 800px) { #contactGrid { grid-template-columns: 1fr !important; } }
</style>
</body>
</html>
